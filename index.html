<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#006847"><link rel="manifest" href="/manifest.webmanifest"><link rel="apple-touch-icon" href="/icon-192.png"><title>TumoreTour</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;background:#f7f8f5;color:#15211d}body{min-height:100dvh}.app{min-height:100dvh;padding:max(16px,env(safe-area-inset-top)) 14px max(20px,env(safe-area-inset-bottom));max-width:760px;margin:auto}.top{display:flex;align-items:center;gap:12px;margin:0 2px 18px}.logo{width:76px;height:76px;border-radius:18px}.brand{font-size:34px;font-weight:900;line-height:1}.brand .g{color:#006847}.brand .r{color:#c8102e}.sub{font-size:18px;font-weight:700;margin-top:6px;color:#4b5752}.home h1{font-size:29px;margin:22px 2px 14px}.route{width:100%;border:0;border-radius:24px;padding:26px 18px;margin:12px 0;text-align:left;color:white;font-weight:900;box-shadow:0 5px 15px #0002}.route b{display:block;font-size:31px}.route span{display:block;font-size:19px;margin-top:7px}.vr{background:#006847}.rv{background:#b20b2b}.note{text-align:center;font-size:16px;font-weight:700;color:#58645f;margin-top:20px}.screen{display:none}.bar{display:flex;gap:10px;align-items:center;margin-bottom:13px}.back,.refresh{border:0;border-radius:16px;font-weight:900;font-size:20px;padding:16px}.back{background:#e6e9e7}.refresh{background:#17231e;color:#fff;flex:1}.title{font-size:27px;font-weight:900;margin:12px 2px}.updated{font-size:16px;font-weight:700;color:#56615d;margin:0 2px 14px}.card{background:#fff;border-radius:22px;padding:18px;margin:12px 0;box-shadow:0 3px 12px #0001;border:2px solid #e6eae8}.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.train{font-size:25px;font-weight:900}.time{font-size:42px;font-weight:900}.meta{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.box{border-radius:16px;padding:13px;text-align:center;background:#f1f3f2}.label{font-size:15px;font-weight:900;color:#59635f}.big{font-size:27px;font-weight:900;margin-top:3px}.ok{color:#08783e}.late{color:#c8102e}.empty,.loading,.error{font-size:22px;font-weight:800;text-align:center;padding:38px 14px}.error{color:#a30b28}@media(max-width:380px){.brand{font-size:29px}.route b{font-size:27px}.time{font-size:37px}}
</style></head><body><main class="app"><header class="top"><img class="logo" src="/icon-192.png" alt=""><div><div class="brand"><span class="g">Tumore</span><span class="r">Tour</span></div><div class="sub">Treni in tempo reale</div></div></header><section id="home" class="home"><h1>Dove devi andare?</h1><button class="route vr" onclick="openRoute('vr')"><b>VERONA → ROMA</b><span>Verona Porta Nuova → Roma Termini</span></button><button class="route rv" onclick="openRoute('rv')"><b>ROMA → VERONA</b><span>Roma Termini → Verona Porta Nuova</span></button><div class="note">Tocca una direzione. Non devi cercare nulla.</div></section><section id="screen" class="screen"><div class="bar"><button class="back" onclick="goHome()">← INDIETRO</button><button class="refresh" onclick="load()">↻ AGGIORNA</button></div><div id="routeTitle" class="title"></div><div id="updated" class="updated"></div><div id="list"></div></section></main><script>
let direction='vr';function openRoute(d){direction=d;home.style.display='none';screen.style.display='block';routeTitle.textContent=d==='vr'?'VERONA → ROMA':'ROMA → VERONA';load()}function goHome(){screen.style.display='none';home.style.display='block'}function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}async function load(){list.innerHTML='<div class="loading">Aggiornamento treni…</div>';updated.textContent='';try{const r=await fetch('/.netlify/functions/trains?direction='+direction+'&t='+Date.now(),{cache:'no-store'});const d=await r.json();if(!d.ok)throw 0;updated.textContent='Aggiornato alle '+new Date().toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'});if(!d.trains.length){list.innerHTML='<div class="empty">Nessun treno diretto trovato in questo momento.</div>';return}list.innerHTML=d.trains.map(t=>`<article class="card"><div class="row"><div class="train">TRENO ${esc(t.number)}</div><div class="time">${esc(t.time)}</div></div><div class="meta"><div class="box"><div class="label">BINARIO</div><div class="big">${esc(t.platform)}</div></div><div class="box"><div class="label">STATO</div><div class="big ${t.delay?'late':'ok'}">${t.delay?'+'+t.delay+' MIN':'IN ORARIO'}</div></div></div>${t.arrival?`<div class="box" style="margin-top:10px"><div class="label">ARRIVO PREVISTO</div><div class="big">${esc(t.arrival)}</div></div>`:''}</article>`).join('')}catch(e){list.innerHTML='<div class="error">Non riesco ad aggiornare i treni.<br>Controlla Internet e premi AGGIORNA.</div>'}}if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js');
</script></body></html>
