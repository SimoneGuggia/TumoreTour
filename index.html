<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>TumoreTour</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f6f8;
  color:#17212b;
}
.app{
  max-width:650px;
  margin:auto;
  padding:20px;
}
.logo{
  display:block;
  width:170px;
  max-width:55%;
  margin:15px auto 10px;
}
h1{
  text-align:center;
  margin:5px 0;
}
.subtitle{
  text-align:center;
  color:#667;
  margin-bottom:25px;
}
.directions{
  display:grid;
  gap:15px;
}
button{
  width:100%;
  border:0;
  border-radius:16px;
  padding:18px;
  font-size:18px;
  font-weight:bold;
  cursor:pointer;
}
.primary{
  background:#087f5b;
  color:white;
}
.secondary{
  background:#d7263d;
  color:white;
}
.controls{
  display:flex;
  gap:10px;
  margin:15px 0;
}
.controls button{
  padding:13px;
  font-size:16px;
}
.back{
  background:#e4e7eb;
  color:#222;
}
.refresh{
  background:#087f5b;
  color:white;
}
#route{
  display:none;
}
#title{
  text-align:center;
  font-size:22px;
  font-weight:bold;
  margin:15px 0;
}
.status{
  text-align:center;
  padding:25px 10px;
  color:#667;
}
.train{
  background:white;
  border-radius:16px;
  margin:12px 0;
  padding:16px;
  box-shadow:0 2px 8px #0001;
}
.trainTop{
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.number{
  font-size:20px;
  font-weight:bold;
}
.time{
  font-size:25px;
  font-weight:bold;
}
.details{
  display:flex;
  justify-content:space-between;
  margin-top:12px;
  color:#555;
}
.delay{
  color:#c92a2a;
  font-weight:bold;
}
.ontime{
  color:#087f5b;
  font-weight:bold;
}
.platform{
  font-weight:bold;
  color:#17212b;
}
</style>
</head>

<body>
<main class="app">

<img class="logo" src="icon-source.png" alt="TumoreTour">

<div id="home">
  <h1>TumoreTour</h1>
  <div class="subtitle">Quale direzione vuoi controllare?</div>

  <div class="directions">
    <button class="primary" onclick="openRoute('vr')">
      🚆 Verso Roma Termini
    </button>

    <button class="secondary" onclick="openRoute('rv')">
      🚆 Verso Verona Porta Nuova
    </button>
  </div>
</div>

<div id="route">
  <div id="title"></div>

  <div class="controls">
    <button class="back" onclick="goBack()">← Indietro</button>
    <button class="refresh" onclick="loadTrains()">↻ Aggiorna</button>
  </div>

  <div id="results"></div>
</div>

</main>

<script>
let direction = null;

function openRoute(d){
  direction = d;

  document.getElementById('home').style.display='none';
  document.getElementById('route').style.display='block';

  document.getElementById('title').textContent =
    d === 'vr'
      ? 'Verso Roma Termini'
      : 'Verso Verona Porta Nuova';

  loadTrains();
}

function goBack(){
  document.getElementById('route').style.display='none';
  document.getElementById('home').style.display='block';
  direction=null;
}

async function loadTrains(){

  const results=document.getElementById('results');

  results.innerHTML=
    '<div class="status">🚆 Aggiornamento treni in corso...</div>';

  try{

    const response=await fetch(
      '/.netlify/functions/trains?direction=' +
      encodeURIComponent(direction) +
      '&t=' + Date.now()
    );

    if(!response.ok){
      throw new Error('Errore HTTP '+response.status);
    }

    const data=await response.json();

    if(!data.ok){
      throw new Error(data.error || 'Errore nel recupero dati');
    }

    if(!data.trains || data.trains.length===0){
      results.innerHTML=
        '<div class="status">Nessun treno trovato.</div>';
      return;
    }

    results.innerHTML='';

    data.trains.forEach(train=>{

      const delay=Number(train.delay || 0);

      const card=document.createElement('div');
      card.className='train';

      card.innerHTML=`
        <div class="trainTop">
          <div class="number">🚆 ${train.number || 'Treno'}</div>
          <div class="time">${train.time || '--:--'}</div>
        </div>

        <div class="details">
          <span>
            Binario:
            <span class="platform">${train.platform || '—'}</span>
          </span>

          <span class="${delay>0?'delay':'ontime'}">
            ${delay>0 ? '+'+delay+' min' : 'In orario'}
          </span>
        </div>

        ${train.arrival
          ? `<div class="details">
               <span>Arrivo previsto</span>
               <strong>${train.arrival}</strong>
             </div>`
          : ''
        }
      `;

      results.appendChild(card);
    });

  }catch(error){

    results.innerHTML=
      '<div class="status">⚠️ Impossibile aggiornare i treni.<br><small>'+
      error.message+
      '</small></div>';

  }
}
</script>

</body>
</html>
